<!doctype html><html><meta charset="utf-8"><title>Minecraft AI Laboratory</title><style>body{background:#101820;color:#dcf2e8;font:16px system-ui;margin:3em}button,input{padding:10px;margin:4px}pre{white-space:pre-wrap} .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:#203329;padding:15px;border-radius:10px}</style><h1>Minecraft AI Laboratory</h1><p>Shared survival world · CPU policy · 256 rays · independent spatial memories</p><input id="token" type="password" placeholder="Local API token"><div id="controls"></div><p id="summary"></p><div class="grid" id="agents"></div><h2>Measured episodes</h2><pre id="results"></pre><script>
for(const c of ['teacher','paused','train','untrained','evaluate','random','checkpoint','backup']){let b=document.createElement('button');b.textContent=c;b.onclick=async()=>{let r=await fetch('/control/'+c,{method:'POST',headers:{'Content-Type':'application/json','X-Lab-Token':document.querySelector('#token').value},body:'{}'});alert(JSON.stringify(await r.json()))};document.querySelector('#controls').append(b)}
async function update(){let s=await(await fetch('/status')).json();document.querySelector('#summary').textContent=`${s.mode} | Server ${s.server_alive?'running':'stopped'} | CPU ${s.cpu_percent}% | RAM ${s.ram_percent}% | ${s.parameters} parameters | ${s.samples} demonstrations`;let root=document.querySelector('#agents');root.replaceChildren();for(const [name,a] of Object.entries(s.agents)){let el=document.createElement('div');el.className='card';el.textContent=`${name}: health ${a.health}, food ${a.food}, position ${a.position.map(x=>x.toFixed(1))}, action ${a.action}, inference ${a.inference_ms.toFixed(2)} ms`;const canvas=document.createElement("canvas");canvas.width=192;canvas.height=64;canvas.title="32 pooled ray groups: brighter means farther; height is normalized depth";const ctx=canvas.getContext("2d");for(let j=0;j<32;j++){let depth=a.rays?.[j*2]??1;ctx.fillStyle=`rgb(${Math.round(depth*220)},180,140)`;ctx.fillRect(j*6,64-depth*64,5,depth*64)}el.append(canvas);root.append(el)}document.querySelector('#results').textContent=JSON.stringify(s.episodes,null,2)}setInterval(update,2000);update();</script></html>
